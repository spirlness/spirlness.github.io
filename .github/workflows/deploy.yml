name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Restore cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .next/cache
          # Exact match only. A stale restored bundle once shipped fresh HTML
          # with stale CSS (PR #26), so no restore-keys fallback is used.
          # The -v2 segment abandons entries saved before this fix.
          key: ${{ runner.os }}-nextjs-v2-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('src/**', 'content/**', 'public/**', 'next.config.*', 'postcss.config.*', 'tsconfig.json') }}

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Lint
        run: ${{ steps.detect-package-manager.outputs.manager }} run lint

      - name: Validate content
        run: ${{ steps.detect-package-manager.outputs.manager }} run content:check

      - name: Test
        run: ${{ steps.detect-package-manager.outputs.manager }} run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run page tests
        run: ${{ steps.detect-package-manager.outputs.manager }} run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify static export
        shell: bash
        run: |
          required_files=(
            "out/index.html"
            "out/blog/index.html"
            "out/projects/index.html"
            "out/publications/index.html"
            "out/sitemap.xml"
            "out/robots.txt"
            "out/feed.xml"
            "out/opengraph-image.png"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file,title=Missing static export file::$file was not generated"
              exit 1
            fi
          done

          # Every blog post must export as out/blog/<slug>/index.html with a
          # URL-safe slug; otherwise the blog index links silently 404.
          if compgen -G "content/posts/*.mdx" > /dev/null; then
            for mdx in content/posts/*.mdx; do
              slug="$(basename "$mdx" .mdx)"
              if [[ ! "$slug" =~ ^[A-Za-z0-9-]+$ ]]; then
                echo "::error file=$mdx,title=Unsafe blog slug::slug '$slug' is not URL-safe; use only [A-Za-z0-9-] in the filename"
                exit 1
              fi
              if [[ ! -f "out/blog/$slug/index.html" ]]; then
                echo "::error file=$mdx,title=Missing static export file::out/blog/$slug/index.html was not generated"
                exit 1
              fi
            done
          fi

          # Project detail routes are keyed on the `id` field *inside* each JSON,
          # not on the filename (see generateStaticParams in
          # src/app/projects/[id]/page.tsx), so read each id the way the build
          # does. parseProject() already fails the build on an id/filename
          # mismatch, but this step re-checks it against the raw JSON (the
          # exported artifact, not the source) so a regression in the schema
          # layer cannot silently ship a 404 page that still has an index.html.
          if compgen -G "content/projects/*.json" > /dev/null; then
            for json in content/projects/*.json; do
              if ! id="$(node -p "require('./$json').id||''")"; then
                echo "::error file=$json,title=Unreadable project JSON::$json could not be parsed"
                exit 1
              fi
              if [[ ! "$id" =~ ^[A-Za-z0-9-]+$ ]]; then
                echo "::error file=$json,title=Unsafe project id::id '$id' is missing or not URL-safe; use only [A-Za-z0-9-]"
                exit 1
              fi
              if [[ "$id" != "$(basename "$json" .json)" ]]; then
                echo "::error file=$json,title=Project id/filename mismatch::id '$id' must equal the filename '$(basename "$json" .json)'; the detail route reads content/projects/$id.json and exports as a 404"
                exit 1
              fi
              if [[ ! -f "out/projects/$id/index.html" ]]; then
                echo "::error file=$json,title=Missing static export file::out/projects/$id/index.html was not generated"
                exit 1
              fi
            done
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
