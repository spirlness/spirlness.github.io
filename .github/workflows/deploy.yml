name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# First attempts supersede builds on the same ref. A re-run uses a separate
# group so it cannot cancel a newer push. The v2 prefix also isolates these
# builds from re-runs that still use the old workflow definition.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: deploy-quality-v2-${{ github.run_attempt == 1 && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # npm's cache is content-addressed and npm ci still verifies the
      # lockfile, so a restore-keys fallback cannot install wrong versions.
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check application and tests
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    concurrency:
      group: deploy-e2e-v2-${{ github.run_attempt == 1 && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Resolve Node runtime
        id: node-runtime
        shell: bash
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Restore/save Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          # Exact key match only, with no fallback restore: a stale restore
          # once shipped fresh HTML with stale CSS (PR #26/#27). The key
          # covers every build input plus the Node runtime; the -v3 segment
          # abandons entries saved under the older keys.
          key: ${{ runner.os }}-nextjs-v3-${{ steps.node-runtime.outputs.version }}-${{ hashFiles('**/package-lock.json', 'package.json', 'src/**', 'content/**', 'public/**', 'next.config.*', 'postcss.config.*', 'tsconfig*.json') }}

      - name: Install dependencies, browsers, and build
        run: bash scripts/build-with-playwright.sh

      - name: Verify static export
        run: npm run export:check

      - name: Run page tests
        env:
          # The export above is already built and verified; the web server
          # only serves out/. Local npm run test:e2e still builds first.
          PW_SKIP_BUILD: "1"
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      # upload-pages-artifact does not overwrite an artifact left by an
      # earlier attempt, so a re-run of this job would fail without this.
      - name: Delete stale Pages artifact on re-run
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[] | select(.name == "github-pages") | .id'); do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
      # A stale re-run must not replace a newer deployment waiting for the lock.
      queue: max
    steps:
      - name: Check current master commit
        id: master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$GITHUB_SHA" == "$head_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping Pages publish for $GITHUB_SHA because master is now $head_sha."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        if: steps.master.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
